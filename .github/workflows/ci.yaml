name: Django CI with Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Create dummy .env file for CI
        run: |
          touch .env
          echo "DJANGO_SECRET_KEY=dummy-secret-key-for-github-actions-test-only" >> .env
          echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
          echo "USE_POSTGRES=1" >> .env
          echo "POSTGRES_DB=minerva_test" >> .env
          echo "POSTGRES_USER=minerva" >> .env
          echo "POSTGRES_PASSWORD=dummy_password" >> .env
          echo "POSTGRES_HOST=db" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "DJANGO_SETTINGS_MODULE=config.settings.dev" >> .env

      - name: Build Docker Images
        run: docker compose -f docker-compose.yml build
      
      - name: Start Database and Services
        
        run: docker compose -f docker-compose.yml up -d db
        
      - name: Wait for PostgreSQL to be ready
        run: sleep 10

      - name: Run Migrations
        run: docker compose -f docker-compose.yml run --rm web python manage.py migrate
      
      - name: Run Tests
        run: docker compose -f docker-compose.yml run --rm web python manage.py test
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml down -v
